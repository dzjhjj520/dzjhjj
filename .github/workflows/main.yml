name: AI Reply Bot (Zhipu Free)

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  reply:
    runs-on: ubuntu-latest

    steps:
      - name: AI Reply (Zhipu Free Model)
        run: |
          # 1. 构建 JSON 请求体
          PAYLOAD=$(jq -n \
            --arg title "${{ github.event.issue.title }}" \
            --arg body "${{ github.event.issue.body }}" \
            '{
              model: "glm-4-flash",
              messages: [
                {role: "system", content: "你是一个专业的GitHub助手，回答简洁清晰。"},
                {role: "user", content: "标题: \($title)\n正文: \($body)"}
              ]
            }')

          # 2. 发送请求给智谱 (注意这里的网址)
          RESPONSE=$(curl -s https://open.bigmodel.cn/api/paas/v4/chat/completions \
            -H "Authorization: Bearer ${{ secrets.DEEPSEEK_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "==== RAW RESPONSE ===="
          echo "$RESPONSE"
          echo "======================"

          # 3. 提取回复（如果报错，就把报错原样发出来）
          COMMENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "⚠️ API 报错，无法获取回复。原始返回：" + (. | tostring)')

          # 4. 安全地构建 GitHub 评论 JSON
          COMMENT_PAYLOAD=$(jq -n --arg body "$COMMENT" '{body: $body}')

          # 5. 发表评论
          curl -s -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
            -d "$COMMENT_PAYLOAD"